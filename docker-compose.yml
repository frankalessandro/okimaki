services:
  db:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: okimaki
    ports:
      - "54322:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./supabase/local-init:/docker-entrypoint-initdb.d:ro
      - ./supabase/migrations:/migrations:ro
volumes:
  pgdata:
